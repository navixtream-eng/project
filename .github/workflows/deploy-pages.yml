# Despliega el documento de estudio (study-ch5) a GitHub Pages como PWA
# instalable. Requiere habilitar Pages una vez en el repositorio:
# Settings → Pages → Source: "GitHub Actions".
name: Deploy study app to GitHub Pages

on:
  push:
    branches: [master, main]
    paths: ['study-ch5/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-ch5/package-lock.json
      - run: npm ci
        working-directory: study-ch5
      - run: npm run build
        working-directory: study-ch5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: study-ch5/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
